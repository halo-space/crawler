[package]
name = "halo-harbor-worker"
version = "0.2.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Executable worker for Harbor crawler applications."
repository = "https://github.com/halo-space/harbor"

[[bin]]
name = "halo-harbor-worker"
path = "src/main.rs"

[dependencies]
harbor = { package = "halo-harbor", path = "..", version = "0.1.2" }
thiserror = { workspace = true }
tokio = { workspace = true }
rustls = { workspace = true }
