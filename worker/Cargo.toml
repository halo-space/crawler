[package]
name = "halo-harbor-worker"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Executable worker for Harbor crawler applications."
repository = "https://github.com/halo-space/harbor"

[[bin]]
name = "halo-harbor-worker"
path = "src/main.rs"

[dependencies]
halo = { package = "halo-harbor-contrib", path = "../contrib", version = "0.2.1" }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
rustls = { workspace = true }
