[package]
name = "halo-harbor-contrib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Redis, MySQL, API Scheduler, and distributed middleware implementations for Harbor."
repository = "https://github.com/halo-space/harbor"
readme = "../README.md"

[features]
default = []
runtime-tracing = ["dep:fastrace", "fastrace/enable", "halo/runtime-tracing"]

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
fastrace = { workspace = true, optional = true }
futures-util = { workspace = true }
redis = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
halo = { package = "halo-harbor", path = "..", version = "0.1.0" }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
uuid = { workspace = true }
