[package]
name = "halo-harbor-facade"
version = "0.2.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Public Harbor facade for the core runtime, contrib extensions, and Worker."
repository = "https://github.com/halo-space/harbor"
readme = "../README.md"

[lib]
name = "halo"

[dependencies]
harbor = { package = "halo-harbor", path = "..", version = "0.1.2" }
contrib = { package = "halo-harbor-contrib", path = "../contrib", version = "0.2.3" }
worker = { package = "halo-harbor-worker", path = "../worker", version = "0.2.3" }
