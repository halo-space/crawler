name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CRAWLER_MYSQL_URL: mysql://crawler:123456@127.0.0.1:3306/crawler
  CRAWLER_REDIS_URL: redis://127.0.0.1:6379

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: crawler
          MYSQL_USER: crawler
          MYSQL_PASSWORD: "123456"
          MYSQL_ROOT_PASSWORD: "123456"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis/redis-stack-server:7.4.0-v8
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli -e BF.EXISTS crawler-ci-bloom-health probe"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
    - uses: actions/checkout@v4
    - name: Install Rust 1.97.0
      uses: dtolnay/rust-toolchain@1.97.0
      with:
        components: rustfmt, clippy
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Check workspace
      run: cargo check --workspace --all-targets
    - name: Run tests
      run: cargo test --workspace
    - name: Run Clippy
      run: cargo clippy --workspace --all-targets -- -D warnings
    - name: Build documentation
      run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
    - name: Check whitespace
      run: |
        empty_tree=$(git hash-object -t tree /dev/null)
        git diff --check "$empty_tree" HEAD
