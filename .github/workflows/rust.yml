name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CRAWLER_REDIS_URL: redis://127.0.0.1:6379

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis/redis-stack-server:7.4.0-v8
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli -e BF.EXISTS crawler-ci-bloom-health probe"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
    - uses: actions/checkout@v4
    - name: Install Rust 1.97.0
      uses: dtolnay/rust-toolchain@1.97.0
      with:
        components: rustfmt, clippy
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Check workspace
      run: cargo check --workspace --all-targets
    - name: Run tests
      run: cargo test --workspace --all-targets --features runtime-tracing
    - name: Run Clippy
      run: cargo clippy --workspace --all-targets --features runtime-tracing -- -D warnings
    - name: Build documentation
      run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --features runtime-tracing
    - name: Check whitespace
      run: |
        empty_tree=$(git hash-object -t tree /dev/null)
        git diff --check "$empty_tree" HEAD
