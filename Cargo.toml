[workspace]
members = ["spider", "contrib", "examples", "macros"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.97.0"
version = "0.1.0"

[workspace.dependencies]
async-openai = { version = "0.41.1", default-features = false, features = ["chat-completion", "rustls"] }
bytes = { version = "1", features = ["serde"] }
chrono = "0.4"
chrono-tz = "0.10"
erased-serde = "0.4"
futures-util = "0.3"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
kameo = { version = "0.22.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v7"] }
validator = { git = "https://github.com/halo-space/validator.git", rev = "2b3128a" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip", "brotli", "deflate", "cookies"] }
scrape-core = "0.2.9"
selectors = "0.39.0"
strsim = "0.11"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit-mut"] }
